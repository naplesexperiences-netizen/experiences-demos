<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Combinato Vesuvio-Pompei — Around Vesuvio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blu: #0B3D61;
    --oro: #e8a020;
    --oro-light: #f5c96a;
    --bianco: #ffffff;
    --grigio: #f4f6f9;
    --testo: #222;
    --testo-light: #555;
  }
  html { scroll-behavior: smooth; }
  body { font-family: system-ui, -apple-system, sans-serif; color: var(--testo); background: #fff; }

  /* DEMO BANNER */
  .demo-banner {
    background: linear-gradient(90deg, var(--oro) 0%, #f5c96a 50%, var(--oro) 100%);
    color: var(--blu);
    text-align: center;
    padding: 10px 16px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .demo-banner a { color: var(--blu); text-decoration: underline; }

  /* NAVBAR */
  nav {
    background: var(--blu);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 64px;
    position: sticky;
    top: 40px;
    z-index: 999;
    box-shadow: 0 2px 12px rgba(0,0,0,0.22);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo-icon {
    width: 40px;
    height: 40px;
    background: var(--oro);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .nav-logo-text {
    color: var(--bianco);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .nav-logo-text span { color: var(--oro); display: block; font-size: 0.7rem; font-weight: 400; }
  .nav-menu {
    display: flex;
    list-style: none;
    gap: 4px;
  }
  .nav-menu a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 0.82rem;
    padding: 6px 10px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .nav-menu a:hover { color: var(--oro); background: rgba(255,255,255,0.08); }
  .btn-preventivo {
    background: var(--oro);
    color: var(--blu) !important;
    font-weight: 700 !important;
    border-radius: 6px !important;
    padding: 8px 14px !important;
    font-size: 0.82rem !important;
  }
  .btn-preventivo:hover { background: var(--oro-light) !important; color: var(--blu) !important; }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--bianco); border-radius: 2px; transition: 0.3s; }

  @media(max-width: 768px) {
    nav { top: 38px; }
    .nav-menu { display: none; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0; background: var(--blu); padding: 16px 24px 24px; gap: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .nav-menu.open { display: flex; }
    .nav-menu a { font-size: 0.95rem; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .hamburger { display: flex; }
    .demo-banner { font-size: 0.72rem; top: 0; }
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, var(--blu) 0%, #0d4f7c 60%, #133d5e 100%);
    min-height: 88vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 80px 24px 60px;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .hero-volcano {
    position: absolute;
    right: -40px;
    bottom: 0;
    width: 55%;
    max-width: 600px;
    opacity: 0.12;
    pointer-events: none;
  }
  .hero-content { position: relative; max-width: 640px; z-index: 1; }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232,160,32,0.18);
    border: 1px solid var(--oro);
    color: var(--oro);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .hero h1 {
    color: var(--bianco);
    font-size: clamp(1.8rem, 4.5vw, 3rem);
    font-weight: 800;
    line-height: 1.18;
    margin-bottom: 16px;
  }
  .hero h1 em { color: var(--oro); font-style: normal; }
  .hero p {
    color: rgba(255,255,255,0.82);
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 520px;
  }
  .hero-cta { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--oro);
    color: var(--blu);
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 1rem;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--oro-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,160,32,0.35); }
  .btn-outline {
    background: transparent;
    color: var(--bianco);
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 1rem;
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-outline:hover { border-color: var(--oro); color: var(--oro); transform: translateY(-2px); }
  .hero-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .hero-tag {
    background: rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.8);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .hero-price-box {
    position: absolute;
    right: 32px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(232,160,32,0.35);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    backdrop-filter: blur(8px);
    z-index: 2;
    min-width: 200px;
  }
  .hero-price-box .from { color: rgba(255,255,255,0.65); font-size: 0.8rem; }
  .hero-price-box .price { color: var(--oro); font-size: 2.6rem; font-weight: 800; }
  .hero-price-box .per { color: rgba(255,255,255,0.65); font-size: 0.8rem; margin-bottom: 16px; }
  .hero-price-box .features { list-style: none; text-align: left; }
  .hero-price-box .features li { color: rgba(255,255,255,0.8); font-size: 0.8rem; padding: 4px 0; display: flex; align-items: center; gap: 7px; }
  .hero-price-box .features li::before { content: '✓'; color: var(--oro); font-weight: 700; }
  @media(max-width: 960px) { .hero-price-box { display: none; } }

  /* STATS */
  .stats { background: var(--blu); padding: 40px 24px; }
  .stats-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 24px; }
  .stat-item { text-align: center; padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
  .stat-item:last-child { border-right: none; }
  .stat-num { font-size: 2.4rem; font-weight: 800; color: var(--oro); display: block; line-height: 1; }
  .stat-label { color: rgba(255,255,255,0.75); font-size: 0.82rem; margin-top: 6px; }
  @media(max-width: 600px) { .stat-item { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); } }

  /* SECTIONS COMMON */
  section { padding: 80px 24px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .section-label {
    display: inline-block;
    background: rgba(232,160,32,0.12);
    color: var(--oro);
    border: 1px solid var(--oro);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .section-title { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; color: var(--blu); margin-bottom: 12px; line-height: 1.25; }
  .section-sub { color: var(--testo-light); font-size: 1rem; max-width: 580px; line-height: 1.7; margin-bottom: 48px; }

  /* TOUR INFO STRIP */
  .tour-strip { background: var(--grigio); border-top: 3px solid var(--oro); }
  .tour-strip-inner { display: flex; gap: 0; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
  .strip-item {
    flex: 1;
    min-width: 180px;
    padding: 28px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-right: 1px solid #e0e4ea;
  }
  .strip-item:last-child { border-right: none; }
  .strip-icon { width: 44px; height: 44px; background: var(--blu); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .strip-label { font-size: 0.72rem; color: var(--testo-light); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .strip-val { font-size: 0.95rem; font-weight: 700; color: var(--blu); }
  @media(max-width: 600px) { .strip-item { border-right: none; border-bottom: 1px solid #e0e4ea; min-width: 50%; } }

  /* SERVIZI */
  .servizi { background: #fff; }
  .grid-6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .card {
    background: #fff;
    border: 1px solid #e8edf3;
    border-radius: 14px;
    padding: 28px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
