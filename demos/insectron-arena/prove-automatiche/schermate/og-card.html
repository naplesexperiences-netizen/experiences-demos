<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>OG card</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#0d1117;
  background-image:radial-gradient(ellipse at 22% 18%,#25344d 0%,transparent 58%);
  font-family:'Trebuchet MS',Verdana,sans-serif;color:#e8edf5;
  display:flex;align-items:center;
}
.left{width:600px;padding:0 0 0 72px;position:relative;z-index:2}
.kicker{
  display:inline-block;font-size:17px;letter-spacing:.2em;text-transform:uppercase;
  color:#93a1b8;border:1px solid #2f3b52;border-radius:999px;padding:9px 22px;margin-bottom:34px
}
h1{font-size:84px;line-height:.98;letter-spacing:1px;text-wrap:balance}
h1 span{color:#ffc24b}
p{font-size:25px;line-height:1.45;color:#93a1b8;margin-top:26px;max-width:520px;text-wrap:balance}
.foot{position:absolute;left:72px;bottom:56px;display:flex;align-items:center;gap:16px;z-index:2}
.pill{background:#ffc24b;color:#231a04;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:12px}
.host{font-size:19px;color:#6c7c94}
.right{
  position:absolute;right:-40px;top:50%;transform:translateY(-50%) rotate(-6deg);
  width:620px;height:620px;border-radius:26px;overflow:hidden;
  border:1px solid #2f3b52;box-shadow:0 40px 90px rgba(0,0,0,.65)
}
.right img{width:100%;height:100%;object-fit:cover;object-position:center}
.fade{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,#0d1117 34%,rgba(13,17,23,.82) 48%,transparent 72%)
}
</style>
</head>
<body>
  <div class="right"><img id="campo" src="" alt=""></div>
  <div class="fade"></div>
  <div class="left">
    <span class="kicker">Prototipo giocabile</span>
    <h1>INSECTRON <span>ARENA</span></h1>
    <p>Cinque pedine, un campo 5×7, un Re da proteggere. Battaglia tattica a turni, nel browser.</p>
  </div>
  <div class="foot">
    <span class="pill">Gioca ora</span>
    <span class="host">experiences Srl · demo gratuita</span>
  </div>
<script>
/* Il riquadro del campo lo genera ogmake.js in una cartella temporanea e lo
   passa qui come parametro: cosi' questo file resta un sorgente, senza
   percorsi di nessuna macchina dentro. */
document.getElementById('campo').src =
  new URLSearchParams(location.search).get('campo') || '';
</script>
</body>
</html>
