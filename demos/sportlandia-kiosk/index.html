<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Sportlandia Infitness - Centro Fitness Castellammare di Stabia. Sala attrezzi, Pilates, Les Mills e molto altro.">
<meta name="theme-color" content="#062c5c">
<title translate="no">SPORTLANDIA INFITNESS — Totem Corsi</title>
<link rel="icon" href="images/logo.webp" type="image/webp">

<!-- Font non bloccante: su un totem senza rete un <link> normale ritarda il
     primo render di ~12s. Fallback di sistema finche' Barlow non arriva. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap"></noscript>

<style>
:root{
  /* Palette brand Sportlandia */
  --navy:#062c5c;
  --cobalt:#0d47a1;
  --blue:#1976d2;
  --cyan:#00bcd4;
  --cyan-soft:#4dd0e1;
  --ink:#0a1c33;
  --paper:#ffffff;

  --font-display:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* Altezze delle fasce fisse: le locandine si adattano a queste */
  --chrome-top:198px;
  --chrome-bottom:252px;
  --footer-h:78px;

  --btn:58px;                  /* pulsanti e contatore: stessa altezza */
  --dur-fast:.22s;
  --dur-slow:.5s;
  --ease-out:cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{color-scheme:dark}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--navy);
  color:#fff;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}

/* Sfondo ambientale: resta dietro alle locandine in formato 3:4 */
.ambient{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 60% at 50% 0%,rgba(0,188,212,.20),transparent 60%),
  linear-gradient(180deg,#04213f 0%,var(--navy) 40%,var(--cobalt) 100%);}
.ambient::after{content:'';position:absolute;inset:0;opacity:.5;
  background:radial-gradient(60% 40% at 50% 100%,rgba(25,118,210,.5),transparent 70%);}

/* ============ ACCESSIBILITA' ============ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:12px}

/* ============ MODO LOCANDINA ============
   Su una slide locandina lo schermo mostrerebbe due volte il logo, due volte il
   telefono, due volte il sito e due serie di orari: la locandina porta gia' tutto.
   Qui la cornice si ritira a barra sottile e restituisce spazio all'immagine. */
body[data-chrome="poster"]{
  --chrome-top:150px;
  --chrome-bottom:290px;
  --footer-h:64px;
}
body[data-chrome="poster"] .header{padding-top:18px;padding-bottom:26px}
body[data-chrome="poster"] .brand-mark{width:44px;height:44px;padding:6px;margin-bottom:0}
body[data-chrome="poster"] .brand-kicker,
body[data-chrome="poster"] .brand-tag{
  opacity:0;height:0;margin:0;overflow:hidden;pointer-events:none;
}
body[data-chrome="poster"] .brand-name{font-size:1.5rem}
/* telefono e orari del centro sono stampati su ogni locandina */
body[data-chrome="poster"] .f-row span:last-child,
body[data-chrome="poster"] .f-hours{display:none}
body[data-chrome="poster"] .footer{min-height:64px;padding-top:9px;padding-bottom:9px}

/* la cornice cambia misura, non deve scattare */
.header,.brand-mark,.brand-name,.footer{
  transition:padding var(--dur-slow,.5s) var(--ease-out),
             width var(--dur-slow,.5s) var(--ease-out),
             height var(--dur-slow,.5s) var(--ease-out),
             min-height var(--dur-slow,.5s) var(--ease-out),
             font-size var(--dur-slow,.5s) var(--ease-out);
}
.brand-kicker,.brand-tag{transition:opacity .35s var(--ease-out),height .45s var(--ease-out)}

/* ============ HEADER ============ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  /* viewport-fit=cover e' dichiarato: senza env() il contenuto finirebbe
     sotto notch e barre di sistema quando non e' su un totem a cornice piena */
  padding:calc(26px + env(safe-area-inset-top)) calc(30px + env(safe-area-inset-right)) 52px
          calc(30px + env(safe-area-inset-left));
  text-align:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,27,52,.94) 0%,rgba(6,44,92,.72) 46%,rgba(6,44,92,.18) 82%,transparent 100%);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.brand-mark{
  width:74px;height:74px;margin:0 auto 10px;border-radius:50%;
  background:#fff;padding:9px;display:grid;place-items:center;
  box-shadow:0 10px 28px rgba(0,188,212,.35),0 0 0 1px rgba(255,255,255,.18);
}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-kicker{
  font-family:var(--font-display);font-size:.82rem;font-weight:600;
  letter-spacing:.42em;text-transform:uppercase;color:var(--cyan-soft);
  margin-bottom:2px;text-indent:.42em;
}
.brand-name{
  font-family:var(--font-display);font-size:2.6rem;font-weight:700;
  letter-spacing:.12em;line-height:1;text-indent:.12em;
  background:linear-gradient(105deg,#fff 0%,#bff0f7 45%,var(--cyan-soft) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-tag{
  font-size:.96rem;font-weight:300;color:rgba(255,255,255,.82);margin-top:6px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}

/* ============ PALCO / SLIDE ============ */
.stage{position:fixed;inset:0;z-index:10}
.deck{position:absolute;inset:0;perspective:2200px}

.slide{
  position:absolute;inset:0;
  visibility:hidden;opacity:0;
  will-change:transform,opacity;
}
/* Superficie cliccabile: un <button> vero sopra tutta la slide, cosi' gli
   orari si aprono anche da tastiera. Il testo resta fuori dal button
   (un <button> non puo' contenere <h2>) e lascia passare i click. */
.slide-hit{
  position:absolute;inset:0;z-index:3;
  border:0;background:none;padding:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.slide-hit:focus-visible{outline:5px solid var(--cyan);outline-offset:-14px;border-radius:0}
/* l'area premuta deve rispondere, altrimenti il tocco sembra ignorato */
.slide:has(.slide-hit:active) .cta{color:var(--cyan);transform:translateX(4px)}
.cta{transition:color var(--dur-fast),transform var(--dur-fast)}
.slide-copy{pointer-events:none}

/* Se una locandina non carica, la slide non resta blu e muta */
.slide-fallback{
  display:none;position:absolute;inset:0;z-index:2;
  place-items:center;text-align:center;
  padding:var(--chrome-top) 12% var(--chrome-bottom);
}
.slide.no-img .slide-fallback{display:grid}
.slide.no-img .slide-img,
.slide.no-img .slide-media::before,
.slide.no-img .slide-media::after{display:none}
.slide-fallback h2{font-family:var(--font-display);font-size:2.4rem;font-weight:700;margin-bottom:10px}
.slide-fallback p{font-size:1.05rem;font-weight:300;color:rgba(255,255,255,.85)}

.slide-media{position:absolute;inset:0;overflow:hidden}
.slide-img{
  position:absolute;inset:0;
  background-repeat:no-repeat;background-position:center;
  will-change:transform;
}

/* Locandina: mostrata per intero, mai tagliata, dentro la fascia libera */
.slide[data-kind="poster"] .slide-img{
  top:var(--chrome-top);bottom:var(--chrome-bottom);
  background-size:contain;
}
/* Alone morbido dietro la locandina, la stacca dal fondo */
.slide[data-kind="poster"] .slide-media::before{
  content:'';position:absolute;left:0;right:0;
  top:var(--chrome-top);bottom:var(--chrome-bottom);
  background:radial-gradient(70% 55% at 50% 50%,rgba(0,188,212,.18),transparent 72%);
}

/* Foto: riempie lo schermo con velatura per leggere il testo */
.slide[data-kind="photo"] .slide-img{inset:0;background-size:cover}
.slide[data-kind="photo"] .slide-media::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,44,92,.62) 0%,rgba(6,44,92,.12) 20%,
    transparent 40%,rgba(6,44,92,.55) 68%,rgba(4,27,52,.96) 94%);
}

/* ============ TESTO (solo slide foto) ============ */
.slide-copy{
  position:absolute;left:0;right:0;bottom:var(--chrome-bottom);
  padding:0 40px 28px;z-index:2;
}
.slide[data-kind="poster"] .slide-copy{display:none}

.tag{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;margin-bottom:14px;
  background:var(--cyan);color:#052b38;border-radius:99px;
  font-family:var(--font-display);font-size:.92rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,188,212,.45);
}
.slide-title{
  font-family:var(--font-display);font-size:3rem;font-weight:700;
  line-height:.98;letter-spacing:.01em;margin-bottom:12px;
  text-shadow:0 6px 28px rgba(0,0,0,.85);
}
.slide-text{
  font-size:1.18rem;font-weight:300;line-height:1.45;max-width:640px;
  color:rgba(255,255,255,.93);margin-bottom:22px;
  text-shadow:0 2px 14px rgba(0,0,0,.85);
}
.cta{
  /* non e' un pulsante: il controllo e' .slide-hit, che copre tutta la slide.
     Senza cornice non promette piu' una pressione che non avverrebbe li'. */
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-display);font-size:1.05rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--cyan-soft);
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.cta svg{width:22px;height:22px}

/* ============ CONTROLLI ============ */
.controls{
  position:fixed;left:0;right:0;bottom:var(--footer-h,78px);z-index:40;
  padding:16px calc(24px + env(safe-area-inset-right)) 18px calc(24px + env(safe-area-inset-left));
  background:linear-gradient(0deg,rgba(4,27,52,.82) 0%,rgba(6,44,92,.42) 62%,transparent 100%);
  pointer-events:none;
}
.controls>*{pointer-events:auto}

.rail{height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:16px}
.rail-fill{height:100%;width:100%;transform:scaleX(0);transform-origin:left center;
  border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));
  box-shadow:0 0 14px rgba(0,188,212,.8)}

.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.dot{
  width:30px;height:26px;padding:10px 0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;
}
/* La larghezza sta qui e non in JS: il nodo <i> non va piu' ricreato a ogni
   cambio slide, altrimenti la transizione non ha un elemento su cui animare */
.dot i{display:block;width:60%;height:5px;border-radius:99px;
  background:rgba(255,255,255,.3);transition:background var(--dur-fast),width var(--dur-fast)}
.dot.is-on i{width:100%;background:var(--cyan);box-shadow:0 0 12px rgba(0,188,212,.75)}

.nav{display:flex;justify-content:center;align-items:center;gap:14px}
/* --btn tiene pulsanti e contatore esattamente della stessa altezza */
.btn{
  width:var(--btn);height:var(--btn);border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:#fff;transition:background var(--dur-fast),transform var(--dur-fast),border-color var(--dur-fast);
}
.btn svg{width:calc(var(--btn) * .45);height:calc(var(--btn) * .45)}
.btn:hover,.btn:active{background:var(--cyan);border-color:var(--cyan);color:#04222c;transform:scale(1.07)}
.counter{
  height:var(--btn);min-width:calc(var(--btn) * 1.85);flex-shrink:0;
  /* flex e non grid: con inline-grid "5", "/" e "12" finirebbero su tre righe */
  display:inline-flex;align-items:center;justify-content:center;gap:.22em;
  padding:0 calc(var(--btn) * .32);border-radius:99px;
  /* stessa superficie dei pulsanti: con un fondo piu' scuro dello sfondo la
     pillola sprofondava e sembrava piu' piccola, pur essendo alta uguale */
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  font-family:var(--font-display);font-weight:600;letter-spacing:.06em;
  font-size:calc(var(--btn) * .4);line-height:1;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.counter b{color:var(--cyan);font-size:calc(var(--btn) * .5)}

/* ============ FOOTER ============ */
.footer{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px calc(26px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))
          calc(26px + env(safe-area-inset-left));
  min-height:78px;
  background:rgba(4,27,52,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid rgba(0,188,212,.3);
}
.f-name{font-family:var(--font-display);font-size:.98rem;font-weight:700;
  letter-spacing:.08em;color:var(--cyan);text-transform:uppercase}
.f-rows{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-width:0}
.f-row{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;min-width:0;overflow:hidden;
  font-size:.76rem;color:rgba(255,255,255,.84);white-space:nowrap}
.f-row span{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.f-row span:last-child{flex:0 0 auto}
.f-row svg{width:13px;height:13px;flex-shrink:0;color:var(--cyan-soft)}
.f-hours{color:#fff;font-weight:500}
.f-brand{
  flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;
  text-decoration:none;padding:9px 16px;border-radius:99px;
  border:1px solid rgba(0,188,212,.34);background:rgba(0,188,212,.12);
  transition:background var(--dur-fast),transform var(--dur-fast);
}
.f-brand small{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.f-brand strong{font-family:var(--font-display);font-size:1rem;font-weight:700;letter-spacing:.05em;
  background:linear-gradient(105deg,var(--cyan),var(--cyan-soft));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ============ MODALE ORARI ============ */
.sheet{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:36px;
  background:rgba(2,14,28,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.sheet.open{display:grid}
.sheet-card{
  width:100%;max-width:620px;max-height:84vh;overflow:hidden;border-radius:28px;
  background:linear-gradient(180deg,#fff 0%,#f3f7fb 100%);color:var(--ink);
  display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.6);
}
.sheet-head{position:relative;padding:30px 32px;color:#fff;
  background:linear-gradient(120deg,var(--cobalt),var(--blue))}
.sheet-head .tag{margin-bottom:10px}
.sheet-title{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.05}
.sheet-close{
  position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;
  border:0;background:rgba(255,255,255,.94);color:var(--cobalt);
  display:grid;place-items:center;cursor:pointer;
  transition:transform var(--dur-fast),background var(--dur-fast);
}
.sheet-close svg{width:22px;height:22px}
.sheet-close:hover{background:var(--cyan);color:#fff;transform:rotate(90deg)}
.sheet-body{padding:26px 32px 32px;overflow-y:auto;overscroll-behavior:contain}
.sheet-label{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  font-family:var(--font-display);font-size:1.05rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt);
}
.sheet-label svg{width:22px;height:22px;color:var(--cyan)}
.row{
  display:flex;gap:18px;padding:16px 20px;margin-bottom:11px;border-radius:14px;
  background:linear-gradient(120deg,#f7fafd,#e9f1f8);border-left:5px solid var(--cyan);
}
.row dt{min-width:156px;font-weight:700;color:var(--cobalt);font-size:.98rem}
.row dd{flex:1;color:#37485c;font-size:.96rem;font-weight:500}

/* ============ 42" — 1080x1920 ============ */
@media (min-height:1600px){
  :root{--chrome-top:300px;--chrome-bottom:340px;--footer-h:112px;--btn:86px}
  body[data-chrome="poster"]{--chrome-top:186px;--chrome-bottom:376px;--footer-h:84px}
  body[data-chrome="poster"] .header{padding-top:26px;padding-bottom:34px}
  body[data-chrome="poster"] .brand-mark{width:62px;height:62px;padding:8px}
  body[data-chrome="poster"] .brand-name{font-size:2.1rem}
  body[data-chrome="poster"] .footer{min-height:84px}
  .header{padding:40px 40px 72px}
  .brand-mark{width:110px;height:110px;padding:13px}
  .brand-kicker{font-size:1.14rem}
  .brand-name{font-size:3.9rem}
  .brand-tag{font-size:1.32rem}
  .slide-copy{padding:0 62px 34px}
  .slide-title{font-size:4.2rem}
  .slide-text{font-size:1.58rem;max-width:860px}
  .tag{font-size:1.2rem;padding:11px 24px}
  .cta{font-size:1.35rem;padding:20px 34px}
  .cta svg{width:28px;height:28px}
  .controls{padding:24px 44px 26px}
  .rail{height:6px;margin-bottom:22px}
  .dots{gap:14px;margin-bottom:22px}
  .dot{width:44px;height:34px}
  .dot i{height:7px}
  .nav{gap:22px}
  .nav{gap:22px}
  .footer{min-height:112px;padding:18px 44px}
  .f-name{font-size:1.32rem}
  .f-row{font-size:.98rem;gap:20px}
  .f-row svg{width:18px;height:18px}
  .f-brand small{font-size:.76rem}
  .f-brand strong{font-size:1.36rem}
  .sheet-card{max-width:820px}
  .sheet-title{font-size:2.7rem}
  .row dt{min-width:230px;font-size:1.26rem}
  .row dd{font-size:1.22rem}
  .sheet-label{font-size:1.32rem}
}

/* ============ Mobile / anteprima ============ */
@media (max-width:520px){
  :root{--chrome-top:152px;--chrome-bottom:212px;--footer-h:86px;--btn:46px}
  body[data-chrome="poster"]{--chrome-top:104px;--chrome-bottom:224px;--footer-h:56px}
  body[data-chrome="poster"] .brand-mark{width:34px;height:34px;padding:5px}
  body[data-chrome="poster"] .brand-name{font-size:1.15rem}
  body[data-chrome="poster"] .footer{min-height:56px}
  .header{padding:18px 16px 40px}
  .brand-mark{width:52px;height:52px;padding:7px;margin-bottom:7px}
  .brand-kicker{font-size:.62rem;letter-spacing:.3em;text-indent:.3em}
  .brand-name{font-size:1.72rem}
  .brand-tag{font-size:.8rem;margin-top:4px}
  .slide-copy{padding:0 20px 20px}
  .slide-title{font-size:1.9rem}
  .slide-text{font-size:.94rem;margin-bottom:16px}
  .tag{font-size:.72rem;padding:6px 13px;margin-bottom:10px}
  .cta{font-size:.86rem;padding:12px 18px}
  .controls{padding:10px 14px 12px}
  .rail{margin-bottom:11px}
  .dots{gap:7px;margin-bottom:11px}
  .dot{width:22px;height:22px}
  .dot i{height:4px}
  .nav{gap:9px}
  .nav{gap:9px}
  .footer{min-height:86px;padding:9px 13px;gap:9px}
  .f-name{font-size:.74rem}
  .f-row{font-size:.6rem;gap:9px}
  .f-brand{padding:6px 11px}
  .f-brand strong{font-size:.78rem}
  .sheet{padding:18px}
  .sheet-head{padding:22px}
  .sheet-title{font-size:1.5rem}
  .sheet-body{padding:20px}
  .row{flex-direction:column;gap:4px}
  .row dt{min-width:0}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<header class="header">
  <div class="brand-mark"><img src="images/logo.webp" alt="" width="74" height="74"></div>
  <p class="brand-kicker">Infitness Castellammare</p>
  <h1 class="brand-name" translate="no">SPORTLANDIA</h1>
  <p class="brand-tag">Rendi il tuo corpo sano e in forma</p>
</header>

<main class="stage">
  <div class="deck" id="deck" aria-roledescription="carosello" aria-label="Corsi e orari Sportlandia"></div>
</main>

<div class="controls">
  <div class="rail" aria-hidden="true"><div class="rail-fill" id="rail"></div></div>
  <div class="dots" id="dots" role="group" aria-label="Vai a un corso"></div>
  <div class="nav">
    <button class="btn" id="prev" type="button" aria-label="Corso precedente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <p class="counter"><b id="cur">1</b> / <span id="tot">12</span></p>
    <button class="btn" id="toggle" type="button" aria-label="Metti in pausa lo scorrimento automatico">
      <svg id="icoPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v16M14 4v16"/></svg>
      <svg id="icoPlay" style="display:none" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72L19 12z"/></svg>
    </button>
    <button class="btn" id="next" type="button" aria-label="Corso successivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<footer class="footer">
  <div class="f-rows">
    <p class="f-name" translate="no">Sportlandia · SSD Infitness ARL</p>
    <p class="f-row">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Corso Alcide De Gasperi, 177/B — Castellammare di Stabia</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>081 871 8076</span>
    </p>
    <p class="f-row f-hours">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Lun-Ven 07:00-21:00 · Sabato 08:00-12:30</span>
    </p>
  </div>
  <p class="f-brand">
    <small>Powered by</small><strong translate="no">naplesexperiences.com</strong>
  </p>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-head">
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Chiudi gli orari">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <p class="tag" id="sheetTag">Corso</p>
      <h2 class="sheet-title" id="sheetTitle">Titolo</h2>
    </div>
    <div class="sheet-body">
      <p class="sheet-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Orari del corso
      </p>
      <dl id="sheetRows"></dl>
    </div>
  </div>
</div>

<p class="sr-only" aria-live="polite" id="live"></p>

<script src="vendor/gsap.min.js"></script>
<script>
(() => {
'use strict';

const COURSES = [
  { title:"Sala Attrezzi", tag:"Fitness", img:"images/sala-attrezzi.webp", poster:true,
    text:"Allenamento completo con macchinari isotonici, pesi liberi e cardio. Sala sempre aperta negli orari del centro.",
    hours:{ "Lun - Ven":"07:00 - 21:00", "Sabato":"08:00 - 12:00" } },

  { title:"Pilates Matwork", tag:"Pilates · Base / Intermedio / Avanzato", img:"images/pilates-matwork.webp", poster:true,
    text:"Pilates a corpo libero su tappetino. Tre livelli: Base, Intermedio e Avanzato. Migliora postura, equilibrio e forza del core.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"09:00 Intermedio · 11:00 Base · 16:00 Base · 18:00 Avanzato · 19:00 Intermedio · 20:00 Base",
            "Giorni pari (Mar · Gio)":"10:00 Base · 14:00 Base · 16:00 Base · 18:00 Intermedio" } },

  { title:"Pilates Reformer", tag:"Pilates", img:"images/pilates-reformer.webp", poster:true,
    text:"Pilates con il macchinario professionale Reformer. Allenamento personalizzato per tonificare e allungare la muscolatura.",
    hours:{ "Lun - Ven":"09:00 - 21:00", "Sabato":"09:00 · 10:00", "Info":"Prenotazione obbligatoria" } },

  { title:"Pilates Studio", tag:"Pilates · Su appuntamento", img:"images/pilates-studio.webp", poster:false,
    text:"Sessioni Pilates Studio con Cadillac, Barile e attrezzi avanzati. Lezioni individuali o duette su appuntamento.",
    hours:{ "Lun - Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"Pilates Tec Room", tag:"Pilates · Sala Tecnica", img:"images/pilates-tec-room.webp", poster:true,
    text:"Lezioni a orario fisso nella sala tecnica: Cadillac, Wunda Chair e grandi attrezzi per postura, mobilità e forza controllata.",
    hours:{ "Giorni pari (Mar · Gio)":"dalle 09:00 alle 17:00", "Turni":"09:00 · 10:00 · 11:00 · 12:00 · 14:00 · 15:00 · 16:00" } },

  { title:"Les Mills Shapes", tag:"Les Mills · Tonificazione", img:"images/lesmills-shapes.webp", poster:true,
    text:"45 minuti a basso impatto che fondono Pilates, sculpt e power yoga in un format fluido.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"10:00 · 17:00", "Giorni pari (Mar · Gio)":"20:00", "Sabato":"10:00" } },

  { title:"Les Mills Strength Development", tag:"Les Mills · Forza", img:"images/lesmills-strength.webp", poster:true,
    text:"Forza progressiva che costruisce muscoli e potenza. Bilancieri, dischi e peso del corpo, adatto a tutti i livelli.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"14:00", "Giorni pari (Mar · Gio)":"19:00" } },

  { title:"Les Mills Ceremony", tag:"Les Mills · X Hyrox", img:"images/lesmills-ceremony.webp", poster:true,
    text:"Funzionale di gruppo ad alta intensità: circuito di forza, cardio e agilità con bilancieri, kettlebell, vogatori e air bike.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"15:00 · 17:00 · 20:00", "Giorni pari (Mar · Gio)":"14:00 · 17:00 · 18:00" } },

  { title:"Les Mills BodyBalance", tag:"Les Mills · Equilibrio", img:"images/lesmills-balance.webp", poster:true,
    text:"Yoga, Tai Chi e pilates per forza, flessibilità e mobilità. Riduce lo stress e favorisce il benessere mentale e fisico.",
    hours:{ "Giorni pari (Mar · Gio)":"08:00 · 17:00", "Sabato":"09:00" } },

  { title:"Orari Completi", tag:"Programmazione Settimanale", img:"images/orari.webp", poster:true,
    text:"Il quadro orario completo di tutte le sale e di tutti i corsi, giorno per giorno.",
    hours:{ "Apertura Lun - Ven":"07:00 - 21:00", "Apertura Sabato":"08:00 - 12:30", "Info e prenotazioni":"Tel. 081 871 8076" } },

  { title:"Fisiorehab 360", tag:"Riabilitazione", img:"images/fisiorehab.webp", poster:false,
    text:"Centro di fisioterapia e riabilitazione integrata. Programmi personalizzati per il recupero funzionale.",
    hours:{ "Lun - Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"GREENtosi", tag:"Eco-Wellness", img:"images/greentosi.webp", poster:false,
    text:"Il nostro impegno per la sostenibilità: impianto fotovoltaico, energia rinnovabile e iniziative eco-friendly.",
    hours:{ "Impegno":"Sportlandia è 100% green", "Energia":"Da fonti rinnovabili", "Iniziative":"Eventi periodici" } }
];

const DWELL = 7;                    // secondi di permanenza per slide
const $ = id => document.getElementById(id);
const deck = $('deck'), dots = $('dots'), rail = $('rail'), live = $('live');
const sheet = $('sheet');

let slides = [], index = 0, dwell = null, flow = null;
let playing = true, onscreen = true, sheetOpen = false;

const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const D = () => reduce.matches ? 0 : 1;   // moltiplicatore durate

/* ---------- costruzione ---------- */
COURSES.forEach((c, i) => {
  const s = document.createElement('article');
  s.className = 'slide';
  s.dataset.kind = c.poster ? 'poster' : 'photo';
  s.setAttribute('aria-roledescription','slide');
  s.setAttribute('aria-label', `${i+1} di ${COURSES.length}: ${c.title}`);
  s.innerHTML =
    `<div class="slide-media"><div class="slide-img" style="background-image:url('${c.img}')"></div></div>` +
    `<div class="slide-fallback"><h2>${c.title}</h2><p>${c.text}</p></div>` +
    (c.poster ? '' :
      `<div class="slide-copy">
         <p class="tag">${c.tag}</p>
         <h2 class="slide-title">${c.title}</h2>
         <p class="slide-text">${c.text}</p>
         <p class="cta" aria-hidden="true">Vedi orari
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
         </p>
       </div>`) +
    `<button class="slide-hit" type="button" aria-label="Vedi gli orari di ${c.title}"></button>`;
  s.querySelector('.slide-hit').addEventListener('click', () => openSheet(i));
  deck.appendChild(s);
  slides.push(s);

  // un background-image non emette onerror: lo verifico a parte, cosi' una
  // locandina mancante mostra nome e descrizione invece di uno schermo blu
  const probe = new Image();
  probe.onerror = () => s.classList.add('no-img');
  probe.src = c.img;

  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', `Vai a ${c.title}`);
  d.innerHTML = '<i></i>';          // creato una volta sola, mai riscritto
  d.addEventListener('click', () => goTo(i, 'manual'));
  dots.appendChild(d);
});
$('tot').textContent = COURSES.length;

gsap.set(slides, { autoAlpha:0 });
gsap.set(slides[0], { autoAlpha:1 });
setChrome(0);
paint(false);
kenBurns(slides[0]);

/* ---------- transizioni ---------- */
// manuale = movimento direzionale (dice "avanti/indietro")
// automatica = dissolvenza ambientale (non simula un gesto che nessuno ha fatto)
function transition(to, mode, dir) {
  if (flow) flow.kill();
  const from = slides[index], next = slides[to];
  gsap.killTweensOf([from, next]);

  index = to;
  setChrome(to);
  paint(mode === 'manual');

  if (!D()) {                      // reduced motion: stato finale, nessun moto
    gsap.set(from, { autoAlpha:0, xPercent:0, scale:1 });
    gsap.set(next, { autoAlpha:1, xPercent:0, scale:1, zIndex:2 });
    startDwell();
    return;
  }

  gsap.set(next, { zIndex:2 });
  gsap.set(from, { zIndex:1 });
  flow = gsap.timeline({ onComplete(){ gsap.set(from,{ autoAlpha:0 }); startDwell(); } });

  if (mode === 'manual') {
    flow.fromTo(next, { autoAlpha:1, xPercent:100*dir, scale:1.05 },
                      { xPercent:0, scale:1, duration:.85, ease:'expo.inOut' }, 0)
        .to(from,     { xPercent:-26*dir, scale:.94, autoAlpha:0, duration:.85, ease:'expo.inOut' }, 0);
  } else {
    flow.fromTo(next, { autoAlpha:0, scale:1.07 },
                      { autoAlpha:1, scale:1, duration:1.15, ease:'power2.out' }, 0)
        .to(from,     { autoAlpha:0, scale:.985, duration:.8, ease:'power1.inOut' }, 0);
  }

  // il testo entra dopo l'immagine, mai insieme: si legge una cosa alla volta
  const copy = next.querySelectorAll('.tag,.slide-title,.slide-text,.cta');
  if (copy.length) {
    flow.fromTo(copy, { autoAlpha:0, y:26 },
      { autoAlpha:1, y:0, duration:.55, stagger:.07, ease:'power2.out' }, .3);
  }
  kenBurns(next);
}

// Su una slide locandina la cornice si ritira: nome corso, orari, telefono e
// sito sono gia' stampati sull'immagine, ripeterli ruba spazio all'unica cosa
// che il visitatore e' li' a leggere.
function setChrome(i) {
  document.body.dataset.chrome = COURSES[i].poster ? 'poster' : 'photo';
}

// Ken Burns solo sulle foto: su una locandina sposterebbe il testo stampato
function kenBurns(slide) {
  const img = slide.querySelector('.slide-img');
  gsap.killTweensOf(img);
  if (slide.dataset.kind !== 'photo' || !D()) { gsap.set(img,{ scale:1, x:0, y:0 }); return; }
  gsap.fromTo(img, { scale:1.02, x:0, y:0 },
    { scale:1.1, x:'1.5%', y:'-1.2%', duration:14, ease:'sine.inOut', repeat:-1, yoyo:true });
}

// announce=false sullo scorrimento automatico: annunciare ogni 7 secondi
// all'infinito rende lo screen reader inascoltabile
function paint(announce) {
  $('cur').textContent = index + 1;
  dots.querySelectorAll('.dot').forEach((d,i) => {
    const on = i === index;
    d.classList.toggle('is-on', on);
    on ? d.setAttribute('aria-current','true') : d.removeAttribute('aria-current');
  });
  if (announce) live.textContent = `${index+1} di ${COURSES.length}: ${COURSES[index].title}`;
}

/* ---------- avanzamento automatico ---------- */
// un solo timer, ed e' la barra stessa: cosi' non possono desincronizzarsi
function startDwell() {
  stopDwell();
  if (!playing || sheetOpen || !onscreen || document.hidden) { gsap.set(rail,{scaleX:0}); return; }
  dwell = gsap.fromTo(rail, { scaleX:0 },
    { scaleX:1, duration:DWELL, ease:'none', onComplete:() => goTo((index+1)%COURSES.length,'auto') });
}
function stopDwell(){ if (dwell) { dwell.kill(); dwell = null; } }

function goTo(to, mode) {
  if (to === index) return;
  const total = COURSES.length;
  const dir = mode === 'auto' ? 1
            : ((to - index + total) % total) <= ((index - to + total) % total) ? 1 : -1;
  transition(to, mode, dir);
}
const step = n => goTo((index + n + COURSES.length) % COURSES.length, 'manual');

function setPlaying(on) {
  playing = on;
  $('icoPlay').style.display = on ? 'none' : 'block';
  $('icoPause').style.display = on ? 'block' : 'none';
  $('toggle').setAttribute('aria-label',
    on ? 'Metti in pausa lo scorrimento automatico' : 'Riprendi lo scorrimento automatico');
  on ? startDwell() : (stopDwell(), bumpIdle());
}

/* ---------- pannello orari ---------- */
// inert sul resto della pagina: senza, con Tab il focus scivolava sui
// pallini dietro l'overlay mentre la modale era aperta
const BEHIND = ['.header','.stage','.controls','.footer'].map(s => document.querySelector(s));
let lastFocus = null;

function openSheet(i) {
  sheetOpen = true; stopDwell(); bumpIdle();
  const c = COURSES[i];
  $('sheetTag').textContent = c.tag;
  $('sheetTitle').textContent = c.title;
  $('sheetRows').innerHTML = Object.entries(c.hours)
    .map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  lastFocus = document.activeElement;
  BEHIND.forEach(el => el && el.setAttribute('inert',''));
  sheet.classList.add('open');
  $('sheetClose').focus();
  if (D()) {
    gsap.fromTo('.sheet-card', { y:44, scale:.96, autoAlpha:0 },
      { y:0, scale:1, autoAlpha:1, duration:.45, ease:'back.out(1.4)' });
    gsap.fromTo('.sheet-body .row', { autoAlpha:0, x:-18 },
      { autoAlpha:1, x:0, duration:.35, stagger:.06, delay:.18, ease:'power2.out' });
  }
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  sheet.classList.remove('open');
  BEHIND.forEach(el => el && el.removeAttribute('inert'));
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
  startDwell();
}

/* ---------- ritorno allo stato di riposo ---------- */
// Un totem non e' presidiato: chi apre gli orari o mette in pausa e se ne va
// lascerebbe lo schermo bloccato li' a tempo indeterminato. Dopo IDLE secondi
// senza tocchi si torna da soli alla prima slide, in riproduzione.
const IDLE = 60;
let idleTimer = null;

function attract() {
  closeSheet();
  if (!playing) setPlaying(true);
  if (index !== 0) goTo(0, 'auto');
}
function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(attract, IDLE * 1000);
}
// solo interazione umana: l'avanzamento automatico non conta come attivita'
['pointerdown','touchstart','keydown'].forEach(ev =>
  addEventListener(ev, bumpIdle, { passive:true, capture:true }));

/* ---------- eventi ---------- */
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('toggle').addEventListener('click', () => setPlaying(!playing));
$('sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if (sheetOpen) return;
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === ' ')          { e.preventDefault(); setPlaying(!playing); }
});

// swipe
let x0 = null;
deck.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive:true });
deck.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 56) step(dx < 0 ? 1 : -1);
}, { passive:true });

// niente lavoro a schermo spento o fuori vista
document.addEventListener('visibilitychange', () => document.hidden ? stopDwell() : startDwell());
new IntersectionObserver(([e]) => { onscreen = e.isIntersecting; onscreen ? startDwell() : stopDwell(); })
  .observe(deck);
reduce.addEventListener('change', () => { stopDwell(); startDwell(); });

startDwell();
bumpIdle();
})();
</script>
</body>
</html>
