<title translate="no">SPORTLANDIA INFITNESS — Totem Corsi</title>

<!-- Il totem e' stato spostato in un repository dedicato. Questo percorso
     resta attivo perche' lo schermo in sede e' configurato su di esso e
     riconfigurarlo richiede di andare fisicamente li'.

     Il reindirizzamento e' fatto in tre modi, perche' questa pagina gira su
     un totem non presidiato: se fallisce, nessuno se ne accorge finche' non
     ci passa davanti un cliente.
       1. location.replace() qui sotto, subito: SOSTITUISCE la voce in
          cronologia invece di aggiungerla
       2. <meta refresh>, che parte dopo un secondo e copre il caso in cui
          JavaScript sia disattivato
       3. il collegamento visibile in fondo, se i primi due non partono

     Il ritardo di un secondo sul meta refresh non e' pigrizia: a zero
     partiva per primo e lasciava una voce in cronologia, cosi' il tasto
     indietro in modalita' chiosco rimbalzava avanti e indietro fra le due
     pagine. Con un secondo vince sempre il JavaScript, e il meta refresh
     resta quello che deve essere: una rete di sicurezza. -->
<script>location.replace('https://naplesexperiences-netizen.github.io/sportlandia/');</script>
<meta http-equiv="refresh" content="1; url=https://naplesexperiences-netizen.github.io/sportlandia/">
<link rel="canonical" href="https://naplesexperiences-netizen.github.io/sportlandia/">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:grid;place-items:center;text-align:center;padding:40px;
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff;
    background:
      radial-gradient(120% 60% at 50% 0%,rgba(0,188,212,.20),transparent 60%),
      linear-gradient(180deg,#04213f 0%,#062c5c 40%,#0d47a1 100%);
  }
  h1{
    font-size:clamp(1.6rem,5vw,2.6rem);font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:18px;
    background:linear-gradient(105deg,#fff 0%,#bff0f7 45%,#4dd0e1 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  p{font-size:clamp(.95rem,2.4vw,1.15rem);font-weight:300;color:rgba(255,255,255,.85);margin-bottom:28px}
  a{
    display:inline-block;padding:16px 30px;border-radius:99px;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.34);
    color:#fff;text-decoration:none;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;font-size:clamp(.85rem,2vw,1rem);
  }
  .spin{
    width:44px;height:44px;margin:0 auto 26px;border-radius:50%;
    border:3px solid rgba(255,255,255,.18);border-top-color:#00bcd4;
    animation:r .9s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <main>
    <div class="spin" aria-hidden="true"></div>
    <h1 translate="no">Sportlandia</h1>
    <p>Il totem si trova ora a un nuovo indirizzo.<br>Reindirizzamento in corso&hellip;</p>
    <a href="https://naplesexperiences-netizen.github.io/sportlandia/">Apri il totem</a>
  </main>
</body>
</html>
