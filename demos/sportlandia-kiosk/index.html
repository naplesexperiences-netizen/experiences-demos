<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sportlandia Infitness - Centro Fitness Castellammare di Stabia. Sala attrezzi, Pilates, MET, Les Mills, Fisiorehab e molto altro.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SPORTLANDIA INFITNESS - Corsi e Attività">
    <meta property="og:description" content="Sportlandia Infitness - Centro Fitness Castellammare di Stabia. Sala attrezzi, Pilates, MET, Les Mills, Fisiorehab e molto altro.">
    <meta property="og:site_name" content="Experiences Srl">
    <meta name="demo:tags" content="kiosk,fitness,touch-screen,castellammare">
    <meta name="demo:category" content="kiosk">
    <title>SPORTLANDIA INFITNESS - Corsi e Attività</title>
    <link rel="icon" href="images/logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font caricato in modo non bloccante: su un kiosk senza rete un <link>
         normale ritarderebbe render e DOMContentLoaded di ~12s, lasciando a
         schermo solo lo spinner. Cosi' la pagina parte subito col fallback. -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --primary: #0d47a1;          /* blu cobalto Sportlandia */
            --primary-light: #1976d2;    /* blu medio sito */
            --primary-soft: #1e88e5;     /* blu pill orari PDF */
            --accent: #00bcd4;           /* ciano logo Infitness */
            --accent-light: #4dd0e1;     /* ciano chiaro */
            --dark: #062c5c;             /* navy profondo */
            --light: #ffffff;
            --gray: #e3f2fd;             /* azzurro cellule orari */
            --footer-h: 76px;            /* altezza barra footer slim */
            --poster-top: 195px;         /* spazio riservato all'header */
            --poster-bottom: 190px;      /* spazio riservato a controlli + footer */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            height: 100%;
        }

        body {
            position: relative;
            min-height: 100vh;
            background: #062c5c;
            overflow-x: hidden;
        }

        /* ==================== HEADER (overlay trasparente) ==================== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 28px 30px 55px;
            text-align: center;
            background: linear-gradient(180deg,
                rgba(6, 44, 92, 0.85) 0%,
                rgba(6, 44, 92, 0.55) 55%,
                rgba(6, 44, 92, 0.15) 85%,
                transparent 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: none;
            z-index: 20;
            pointer-events: none;
        }

        .header * { pointer-events: auto; }

        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top, rgba(0, 188, 212, 0.18), transparent 70%);
            pointer-events: none;
        }

        .header-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: white;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff 0%, #4dd0e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 25px rgba(0, 188, 212, 0.4);
        }

        .header .subtitle {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header .tagline {
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        /* ==================== HERO SECTION (rimosso - integrato nel card) ==================== */
        .hero {
            display: none;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--light);
            margin-bottom: 5px;
        }

        .hero p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.7); }
            50% { transform: scale(1.2); opacity: 0.8; box-shadow: 0 0 0 15px rgba(0, 188, 212, 0); }
        }

        /* ==================== GALLERY (full-screen) ==================== */
        .gallery-section {
            position: fixed;
            inset: 0;
            padding: 0;
            margin: 0;
            z-index: 1;
        }

        .gallery-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            margin: 0;
            perspective: 2000px;
        }

        /* ==================== SLIDER REVOLUTION-STYLE (full-screen) ==================== */
        .course-card {
            position: absolute;
            inset: 0;
            border-radius: 0;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            background: var(--dark);
            will-change: transform, opacity, filter, clip-path;
            transform-origin: center;
        }

        .course-card.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* --------- KEYFRAMES: 4 effetti che si alternano --------- */

        /* 1. SLIDE 3D (direction-aware) */
        @keyframes slideInRight {
            0%   { transform: translateX(115%) scale(0.82) rotateY(-25deg); opacity: 0; filter: blur(18px) brightness(0.6); }
            60%  { opacity: 1; }
            100% { transform: translateX(0) scale(1) rotateY(0); opacity: 1; filter: blur(0) brightness(1); }
        }
        @keyframes slideInLeft {
            0%   { transform: translateX(-115%) scale(0.82) rotateY(25deg); opacity: 0; filter: blur(18px) brightness(0.6); }
            60%  { opacity: 1; }
            100% { transform: translateX(0) scale(1) rotateY(0); opacity: 1; filter: blur(0) brightness(1); }
        }
        @keyframes slideOutLeft {
            0%   { transform: translateX(0) scale(1) rotateY(0); opacity: 1; filter: blur(0); }
            100% { transform: translateX(-45%) scale(0.82) rotateY(25deg); opacity: 0; filter: blur(16px) brightness(0.5); }
        }
        @keyframes slideOutRight {
            0%   { transform: translateX(0) scale(1) rotateY(0); opacity: 1; filter: blur(0); }
            100% { transform: translateX(45%) scale(0.82) rotateY(-25deg); opacity: 0; filter: blur(16px) brightness(0.5); }
        }

        /* 2. IRIS ZOOM: clip-path circle che si apre dal centro */
        @keyframes irisIn {
            0%   { clip-path: circle(0% at 50% 50%); transform: scale(1.25); opacity: 0; }
            10%  { opacity: 1; }
            100% { clip-path: circle(120% at 50% 50%); transform: scale(1); opacity: 1; }
        }
        @keyframes irisOut {
            0%   { clip-path: circle(120% at 50% 50%); transform: scale(1); opacity: 1; }
            100% { clip-path: circle(0% at 50% 50%); transform: scale(1.1); opacity: 0; }
        }

        /* 3. CURTAIN: si apre dal centro come due tende verticali */
        @keyframes curtainIn {
            0%   { clip-path: inset(0 50% 0 50%); opacity: 0; transform: scale(1.05); }
            15%  { opacity: 1; }
            100% { clip-path: inset(0 0% 0 0%); opacity: 1; transform: scale(1); }
        }
        @keyframes curtainOut {
            0%   { clip-path: inset(0 0% 0 0%); opacity: 1; }
            100% { clip-path: inset(0 50% 0 50%); opacity: 0; transform: scale(0.95); }
        }

        /* 4. DIAGONAL WIPE: clip diagonale che attraversa */
        @keyframes diagonalIn {
            0%   { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); opacity: 0; transform: scale(1.1); }
            15%  { opacity: 1; }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; transform: scale(1); }
        }
        @keyframes diagonalOut {
            0%   { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
            100% { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); opacity: 0; transform: scale(0.95); }
        }

        /* --------- APPLICAZIONE EFFETTI --------- */
        .course-card.enter-slide-next   { animation: slideInRight 1.3s cubic-bezier(0.86, 0, 0.07, 1) forwards; }
        .course-card.enter-slide-prev   { animation: slideInLeft 1.3s cubic-bezier(0.86, 0, 0.07, 1) forwards; }
        .course-card.enter-iris         { animation: irisIn 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        .course-card.enter-curtain      { animation: curtainIn 1.2s cubic-bezier(0.86, 0, 0.07, 1) forwards; }
        .course-card.enter-diagonal     { animation: diagonalIn 1.2s cubic-bezier(0.86, 0, 0.07, 1) forwards; }

        .course-card.leave-slide-next   { animation: slideOutLeft 1.0s cubic-bezier(0.86, 0, 0.07, 1) forwards; z-index: 5; }
        .course-card.leave-slide-prev   { animation: slideOutRight 1.0s cubic-bezier(0.86, 0, 0.07, 1) forwards; z-index: 5; }
        .course-card.leave-iris         { animation: irisOut 0.9s ease forwards; z-index: 5; }
        .course-card.leave-curtain      { animation: curtainOut 0.9s cubic-bezier(0.86, 0, 0.07, 1) forwards; z-index: 5; }
        .course-card.leave-diagonal     { animation: diagonalOut 0.9s cubic-bezier(0.86, 0, 0.07, 1) forwards; z-index: 5; }

        /* --------- IMMAGINE: adattata al viewport + Ken Burns sobrio --------- */
        .course-image-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transform: scale(1.04);
        }

        @keyframes kenBurns {
            0%   { transform: scale(1.04) translate(-0.5%, -0.5%); }
            33%  { transform: scale(1.10) translate(1.5%, -1%); }
            66%  { transform: scale(1.08) translate(-1%, 1.5%); }
            100% { transform: scale(1.04) translate(-0.5%, -0.5%); }
        }

        .course-card.active .course-image-bg {
            animation: kenBurns 18s ease-in-out infinite;
        }

        /* --------- SLIDE "LOCANDINA": immagine intera, mai tagliata --------- */
        /* Le locandine ufficiali hanno nome corso e orari gia' stampati:
           vanno mostrate per intero (contain) e senza testo sovrapposto. */
        .course-card.is-poster .course-image-bg,
        .course-card.is-poster.active .course-image-bg {
            inset: var(--poster-top, 195px) 0 var(--poster-bottom, 190px) 0;
            /* la regola base impone width/height 100%: va neutralizzata,
               altrimenti l'inset inferiore viene ignorato e la locandina sfora */
            width: auto;
            height: auto;
            background-size: contain;
            background-position: center center;
            transform: none;
            animation: none;
        }

        /* Niente velatura scura sopra la locandina */
        .course-card.is-poster::after {
            background: none;
        }

        /* Il testo e' gia' nella locandina: nessun overlay duplicato */
        .course-card.is-poster .course-info {
            display: none;
        }

        /* --------- SHINE SWEEP sull'attivazione --------- */
        @keyframes shine {
            0%   { transform: translateX(-120%) skewX(-20deg); opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateX(120%) skewX(-20deg); opacity: 0; }
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 60%;
            background: linear-gradient(110deg,
                transparent 0%,
                rgba(255, 255, 255, 0.08) 35%,
                rgba(0, 188, 212, 0.25) 50%,
                rgba(255, 255, 255, 0.08) 65%,
                transparent 100%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-120%);
        }

        .course-card.active::before {
            animation: shine 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
        }

        .course-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg,
                    rgba(6, 44, 92, 0.55) 0%,
                    rgba(6, 44, 92, 0.15) 12%,
                    transparent 28%,
                    transparent 45%,
                    rgba(6, 44, 92, 0.55) 70%,
                    rgba(6, 44, 92, 0.95) 95%);
            z-index: 1;
        }

        /* --------- PROGRESS BAR: countdown autoplay --------- */
        .course-progress {
            position: absolute;
            bottom: var(--footer-h, 76px);
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 4;
            overflow: hidden;
        }

        .course-progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            box-shadow: 0 0 12px rgba(0, 188, 212, 0.7);
            border-radius: 0 4px 4px 0;
        }

        @keyframes progressFill {
            from { width: 0; }
            to { width: 100%; }
        }

        .course-card.active .course-progress-fill {
            animation: progressFill 7s linear forwards;
        }

        .course-info {
            position: absolute;
            bottom: 230px;
            left: 0;
            right: 0;
            padding: 0 40px;
            z-index: 2;
            color: white;
        }

        .course-category {
            display: inline-block;
            padding: 8px 18px;
            background: var(--accent);
            color: white;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
        }

        .course-title {
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        .course-description {
            font-size: 1.15rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.45;
            margin-bottom: 20px;
            max-width: 600px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .course-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .course-card.active:hover .course-cta {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .course-cta-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 50%;
            font-size: 0.9rem;
        }

        /* ==================== CONTROLS OVERLAY (flottanti sul fondo) ==================== */
        .controls-overlay {
            position: fixed;
            bottom: calc(var(--footer-h, 76px) + 16px);
            left: 0;
            right: 0;
            z-index: 15;
            padding: 18px 25px 0;
            background: linear-gradient(0deg,
                rgba(6, 44, 92, 0.55) 0%,
                rgba(6, 44, 92, 0.25) 60%,
                transparent 100%);
            pointer-events: none;
        }

        .controls-overlay > * { pointer-events: auto; }

        /* ==================== INDICATORS ==================== */
        .indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .indicator {
            width: 28px;
            height: 5px;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            border: none;
            padding: 0;
        }

        .indicator.active {
            background: var(--accent);
            width: 48px;
            box-shadow: 0 0 12px rgba(0, 188, 212, 0.6);
        }

        /* ==================== NAVIGATION (pulsanti compatti) ==================== */
        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: 300;
            padding: 0;
            line-height: 1;
        }

        .nav-btn:hover, .nav-btn:active {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 8px 22px rgba(0, 188, 212, 0.4);
        }

        .nav-counter {
            background: rgba(6, 44, 92, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            min-width: 78px;
            text-align: center;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
        }

        .nav-counter .current {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 800;
        }

        /* ==================== MODAL ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: linear-gradient(180deg, var(--light) 0%, #f8f9fb 100%);
            border-radius: 30px;
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transform: translateY(40px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.show .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            position: relative;
            height: 200px;
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            align-items: flex-end;
            padding: 30px;
        }

        .modal-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13, 71, 161, 0.5) 0%, rgba(6, 44, 92, 0.95) 100%);
        }

        .modal-header-content {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .modal-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .close-btn:hover {
            background: var(--accent);
            color: white;
            transform: rotate(90deg) scale(1.1);
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .schedule-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .schedule-title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            font-size: 1rem;
        }

        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .schedule-day {
            display: flex;
            background: linear-gradient(135deg, #f8f9fb 0%, #eef2f7 100%);
            border-left: 5px solid var(--accent);
            border-radius: 12px;
            padding: 15px 20px;
            transition: transform 0.3s ease;
        }

        .schedule-day:hover {
            transform: translateX(5px);
        }

        .schedule-day-name {
            min-width: 130px;
            font-weight: 700;
            color: var(--primary);
            font-size: 1rem;
        }

        .schedule-time {
            color: #555;
            font-size: 0.95rem;
            font-weight: 500;
            flex: 1;
        }

        /* ==================== FOOTER ==================== */

<script>
(() => {
'use strict';

const COURSES = [
  { title:"Sala Attrezzi", tag:"Fitness", img:"images/sala-attrezzi.webp", poster:true,
    text:"Allenamento completo con macchinari isotonici, pesi liberi e cardio. Sala sempre aperta negli orari del centro.",
    hours:{ "Lun–Ven":"07:00–21:00", "Sabato":"08:00–12:00" } },

  { title:"Pilates Matwork", tag:"Pilates · Base / Intermedio / Avanzato", img:"images/pilates-matwork.webp", poster:true,
    text:"Pilates a corpo libero su tappetino. Tre livelli: Base, Intermedio e Avanzato. Migliora postura, equilibrio e forza del core.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"09:00 Intermedio · 11:00 Base · 16:00 Base · 18:00 Avanzato · 19:00 Intermedio · 20:00 Base",
            "Giorni pari (Mar · Gio)":"10:00 Base · 14:00 Base · 16:00 Base · 18:00 Intermedio" } },

  { title:"Pilates Reformer", tag:"Pilates", img:"images/pilates-reformer.webp", poster:true,
    text:"Pilates con il macchinario professionale Reformer. Allenamento personalizzato per tonificare e allungare la muscolatura.",
    hours:{ "Lun–Ven":"09:00–21:00", "Sabato":"09:00 · 10:00", "Info":"Prenotazione obbligatoria" } },

  { title:"Pilates Studio", tag:"Pilates · Su appuntamento", img:"images/pilates-studio.webp", poster:false,
    text:"Sessioni Pilates Studio con Cadillac, Barile e attrezzi avanzati. Lezioni individuali o duette su appuntamento.",
    hours:{ "Lun–Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"Pilates Tec Room", tag:"Pilates · Sala Tecnica", img:"images/pilates-tec-room.webp", poster:true,
    text:"Lezioni a orario fisso nella sala tecnica: Cadillac, Wunda Chair e grandi attrezzi per postura, mobilità e forza controllata.",
    hours:{ "Giorni pari (Mar · Gio)":"dalle 09:00 alle 17:00", "Turni":"09:00 · 10:00 · 11:00 · 12:00 · 14:00 · 15:00 · 16:00" } },

  { title:"Les Mills Shapes", tag:"Les Mills · Tonificazione", img:"images/lesmills-shapes.webp", poster:true,
    text:"45 minuti a basso impatto che fondono Pilates, sculpt e power yoga in un format fluido.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"10:00 · 17:00", "Giorni pari (Mar · Gio)":"20:00", "Sabato":"10:00" } },

  { title:"Les Mills Strength Development", tag:"Les Mills · Forza", img:"images/lesmills-strength.webp", poster:true,
    text:"Forza progressiva che costruisce muscoli e potenza. Bilancieri, dischi e peso del corpo, adatto a tutti i livelli.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"14:00", "Giorni pari (Mar · Gio)":"19:00" } },

  { title:"Les Mills Ceremony", tag:"Les Mills · X Hyrox", img:"images/lesmills-ceremony.webp", poster:true,
    text:"Funzionale di gruppo ad alta intensità: circuito di forza, cardio e agilità con bilancieri, kettlebell, vogatori e air bike.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"15:00 · 17:00 · 20:00", "Giorni pari (Mar · Gio)":"14:00 · 17:00 · 18:00" } },

  { title:"Les Mills BodyBalance", tag:"Les Mills · Equilibrio", img:"images/lesmills-balance.webp", poster:true,
    text:"Yoga, Tai Chi e pilates per forza, flessibilità e mobilità. Riduce lo stress e favorisce il benessere mentale e fisico.",
    hours:{ "Giorni pari (Mar · Gio)":"08:00 · 17:00", "Sabato":"09:00" } },

  { title:"Orari Completi", tag:"Programmazione Settimanale", img:"images/orari.webp", poster:true,
    text:"Il quadro orario completo di tutte le sale e di tutti i corsi, giorno per giorno.",
    hours:{ "Apertura Lun–Ven":"07:00–21:00", "Apertura Sabato":"08:00–12:30", "Info e prenotazioni":"Tel. 081 871 8076" } },

  { title:"Fisiorehab 360", tag:"Riabilitazione", img:"images/fisiorehab.webp", poster:false,
    text:"Centro di fisioterapia e riabilitazione integrata. Programmi personalizzati per il recupero funzionale.",
    hours:{ "Lun–Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"GREENtosi", tag:"Eco-Wellness", img:"images/greentosi.webp", poster:false,
    text:"Il nostro impegno per la sostenibilità: impianto fotovoltaico, energia rinnovabile e iniziative eco-friendly.",
    hours:{ "Impegno":"Sportlandia è 100% green", "Energia":"Da fonti rinnovabili", "Iniziative":"Eventi periodici" } }
];

const DWELL = 7;                    // secondi di permanenza per slide
const $ = id => document.getElementById(id);
const deck = $('deck'), dots = $('dots'), rail = $('rail'), live = $('live');
const sheet = $('sheet');

let slides = [], index = 0, dwell = null, flow = null;
let playing = true, onscreen = true, sheetOpen = false;

const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const D = () => reduce.matches ? 0 : 1;   // moltiplicatore durate

/* ---------- costruzione ---------- */
COURSES.forEach((c, i) => {
  const s = document.createElement('article');
  s.className = 'slide';
  s.dataset.kind = c.poster ? 'poster' : 'photo';
  s.setAttribute('aria-roledescription','slide');
  s.setAttribute('aria-label', `${i+1} di ${COURSES.length}: ${c.title}`);
  s.innerHTML =
    `<div class="slide-media"><div class="slide-img" style="background-image:url('${c.img}')"></div></div>` +
    `<div class="slide-fallback"><h2>${c.title}</h2><p>${c.text}</p></div>` +
    (c.poster ? '' :
      `<div class="slide-copy">
         <p class="tag">${c.tag}</p>
         <h2 class="slide-title">${c.title}</h2>
         <p class="slide-text">${c.text}</p>
         <p class="cta" aria-hidden="true">Vedi orari
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
         </p>
       </div>`) +
    `<button class="slide-hit" type="button" aria-label="Vedi gli orari di ${c.title}"></button>`;
  s.querySelector('.slide-hit').addEventListener('click', () => openSheet(i));
  deck.appendChild(s);
  slides.push(s);

  // un background-image non emette onerror: lo verifico a parte, cosi' una
  // locandina mancante mostra nome e descrizione invece di uno schermo blu
  const probe = new Image();
  probe.onerror = () => s.classList.add('no-img');
  probe.src = c.img;

  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', `Vai a ${c.title}`);
  d.innerHTML = '<i></i>';          // creato una volta sola, mai riscritto
  d.addEventListener('click', () => goTo(i, 'manual'));
  dots.appendChild(d);
});
$('tot').textContent = COURSES.length;

gsap.set(slides, { autoAlpha:0 });
gsap.set(slides[0], { autoAlpha:1 });
paint(false);
kenBurns(slides[0]);

/* ---------- transizioni ---------- */
// manuale = movimento direzionale (dice "avanti/indietro")
// automatica = dissolvenza ambientale (non simula un gesto che nessuno ha fatto)
function transition(to, mode, dir) {
  if (flow) flow.kill();
  const from = slides[index], next = slides[to];
  gsap.killTweensOf([from, next]);

  index = to;
  paint(mode === 'manual');

  if (!D()) {                      // reduced motion: stato finale, nessun moto
    gsap.set(from, { autoAlpha:0, xPercent:0, scale:1 });
    gsap.set(next, { autoAlpha:1, xPercent:0, scale:1, zIndex:2 });
    startDwell();
    return;
  }

  gsap.set(next, { zIndex:2 });
  gsap.set(from, { zIndex:1 });
  flow = gsap.timeline({ onComplete(){ gsap.set(from,{ autoAlpha:0 }); startDwell(); } });

  if (mode === 'manual') {
    flow.fromTo(next, { autoAlpha:1, xPercent:100*dir, scale:1.05 },
                      { xPercent:0, scale:1, duration:.85, ease:'expo.inOut' }, 0)
        .to(from,     { xPercent:-26*dir, scale:.94, autoAlpha:0, duration:.85, ease:'expo.inOut' }, 0);
  } else {
    flow.fromTo(next, { autoAlpha:0, scale:1.07 },
                      { autoAlpha:1, scale:1, duration:1.15, ease:'power2.out' }, 0)
        .to(from,     { autoAlpha:0, scale:.985, duration:.8, ease:'power1.inOut' }, 0);
  }

  // il testo entra dopo l'immagine, mai insieme: si legge una cosa alla volta
  const copy = next.querySelectorAll('.tag,.slide-title,.slide-text,.cta');
  if (copy.length) {
    flow.fromTo(copy, { autoAlpha:0, y:26 },
      { autoAlpha:1, y:0, duration:.55, stagger:.07, ease:'power2.out' }, .3);
  }
  kenBurns(next);
}

// Ken Burns solo sulle foto: su una locandina sposterebbe il testo stampato
function kenBurns(slide) {
  const img = slide.querySelector('.slide-img');
  gsap.killTweensOf(img);
  if (slide.dataset.kind !== 'photo' || !D()) { gsap.set(img,{ scale:1, x:0, y:0 }); return; }
  gsap.fromTo(img, { scale:1.02, x:0, y:0 },
    { scale:1.1, x:'1.5%', y:'-1.2%', duration:14, ease:'sine.inOut', repeat:-1, yoyo:true });
}

// announce=false sullo scorrimento automatico: annunciare ogni 7 secondi
// all'infinito rende lo screen reader inascoltabile
function paint(announce) {
  $('cur').textContent = index + 1;
  dots.querySelectorAll('.dot').forEach((d,i) => {
    const on = i === index;
    d.classList.toggle('is-on', on);
    on ? d.setAttribute('aria-current','true') : d.removeAttribute('aria-current');
  });
  if (announce) live.textContent = `${index+1} di ${COURSES.length}: ${COURSES[index].title}`;
}

/* ---------- avanzamento automatico ---------- */
// un solo timer, ed e' la barra stessa: cosi' non possono desincronizzarsi
function startDwell() {
  stopDwell();
  if (!playing || sheetOpen || !onscreen || document.hidden) { gsap.set(rail,{scaleX:0}); return; }
  dwell = gsap.fromTo(rail, { scaleX:0 },
    { scaleX:1, duration:DWELL, ease:'none', onComplete:() => goTo((index+1)%COURSES.length,'auto') });
}
function stopDwell(){ if (dwell) { dwell.kill(); dwell = null; } }

function goTo(to, mode) {
  if (to === index) return;
  const total = COURSES.length;
  const dir = mode === 'auto' ? 1
            : ((to - index + total) % total) <= ((index - to + total) % total) ? 1 : -1;
  transition(to, mode, dir);
}
const step = n => goTo((index + n + COURSES.length) % COURSES.length, 'manual');

function setPlaying(on) {
  playing = on;
  $('icoPlay').style.display = on ? 'none' : 'block';
  $('icoPause').style.display = on ? 'block' : 'none';
  $('toggle').setAttribute('aria-label',
    on ? 'Metti in pausa lo scorrimento automatico' : 'Riprendi lo scorrimento automatico');
  on ? startDwell() : (stopDwell(), bumpIdle());
}

/* ---------- pannello orari ---------- */
// inert sul resto della pagina: senza, con Tab il focus scivolava sui
// pallini dietro l'overlay mentre la modale era aperta
const BEHIND = ['.header','.stage','.controls','.footer'].map(s => document.querySelector(s));
let lastFocus = null;

function openSheet(i) {
  sheetOpen = true; stopDwell(); bumpIdle();
  const c = COURSES[i];
  $('sheetTag').textContent = c.tag;
  $('sheetTitle').textContent = c.title;
  $('sheetRows').innerHTML = Object.entries(c.hours)
    .map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  lastFocus = document.activeElement;
  BEHIND.forEach(el => el && el.setAttribute('inert',''));
  sheet.classList.add('open');
  $('sheetClose').focus();
  if (D()) {
    gsap.fromTo('.sheet-card', { y:44, scale:.96, autoAlpha:0 },
      { y:0, scale:1, autoAlpha:1, duration:.45, ease:'back.out(1.4)' });
    gsap.fromTo('.sheet-body .row', { autoAlpha:0, x:-18 },
      { autoAlpha:1, x:0, duration:.35, stagger:.06, delay:.18, ease:'power2.out' });
  }
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  sheet.classList.remove('open');
  BEHIND.forEach(el => el && el.removeAttribute('inert'));
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
  startDwell();
}

/* ---------- ritorno allo stato di riposo ---------- */
// Un totem non e' presidiato: chi apre gli orari o mette in pausa e se ne va
// lascerebbe lo schermo bloccato li' a tempo indeterminato. Dopo IDLE secondi
// senza tocchi si torna da soli alla prima slide, in riproduzione.
const IDLE = 60;
let idleTimer = null;

function attract() {
  closeSheet();
  if (!playing) setPlaying(true);
  if (index !== 0) goTo(0, 'auto');
}
function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(attract, IDLE * 1000);
}
// solo interazione umana: l'avanzamento automatico non conta come attivita'
['pointerdown','touchstart','keydown'].forEach(ev =>
  addEventListener(ev, bumpIdle, { passive:true, capture:true }));

/* ---------- eventi ---------- */
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('toggle').addEventListener('click', () => setPlaying(!playing));
$('sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if (sheetOpen) return;
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === ' ')          { e.preventDefault(); setPlaying(!playing); }
});

// swipe
let x0 = null;
deck.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive:true });
deck.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 56) step(dx < 0 ? 1 : -1);
}, { passive:true });

// niente lavoro a schermo spento o fuori vista
document.addEventListener('visibilitychange', () => document.hidden ? stopDwell() : startDwell());
new IntersectionObserver(([e]) => { onscreen = e.isIntersecting; onscreen ? startDwell() : stopDwell(); })
  .observe(deck);
reduce.addEventListener('change', () => { stopDwell(); startDwell(); });

startDwell();
bumpIdle();
})();
</script>
</body>
</html>
