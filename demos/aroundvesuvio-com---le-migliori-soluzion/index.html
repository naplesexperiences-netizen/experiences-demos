<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AroundVesuvio.com — Le Migliori Soluzioni per la tua Vacanza in Campania</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blu: #0B3D61;
    --oro: #e8a020;
    --oro-light: #f5c96a;
    --bianco: #ffffff;
    --grigio-chiaro: #f4f6f9;
    --grigio: #666;
    --testo: #222;
  }
  html { scroll-behavior: smooth; }
  body { font-family: system-ui, -apple-system, sans-serif; color: var(--testo); background: #fff; }
  a { text-decoration: none; color: inherit; }
  img { max-width: 100%; }

  /* ===== DEMO BANNER ===== */
  .demo-banner {
    background: linear-gradient(90deg, #b8860b, var(--oro), #b8860b);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .demo-banner a { color: #fff; text-decoration: underline; }
  .demo-banner span { opacity: 0.9; font-weight: 400; }

  /* ===== NAVBAR ===== */
  nav {
    background: var(--blu);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 40px;
    z-index: 999;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 1.1rem;
  }
  .nav-logo .logo-icon {
    width: 40px; height: 40px;
    background: var(--oro);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
  }
  .nav-logo span.sub { font-weight: 400; font-size: 0.72rem; opacity: 0.8; display: block; }
  .nav-menu {
    display: flex;
    gap: 6px;
    list-style: none;
    align-items: center;
  }
  .nav-menu li a {
    color: rgba(255,255,255,0.85);
    font-size: 0.82rem;
    padding: 6px 10px;
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-menu li a:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-preventivo {
    background: var(--oro);
    color: var(--blu) !important;
    font-weight: 700 !important;
    padding: 8px 16px !important;
    border-radius: 20px !important;
    font-size: 0.82rem !important;
    transition: all 0.2s !important;
    white-space: nowrap;
  }
  .btn-preventivo:hover { background: var(--oro-light) !important; transform: scale(1.04); }
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }
  .hamburger span { display: block; width: 24px; height: 2px; background: #fff; border-radius: 2px; transition: 0.3s; }
  .mobile-menu {
    display: none;
    background: var(--blu);
    padding: 16px 24px;
    flex-direction: column;
    gap: 4px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .mobile-menu a { color: rgba(255,255,255,0.85); padding: 10px 0; display: block; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .mobile-menu a:last-child { border: none; }
  .mobile-menu.open { display: flex; }

  /* ===== HERO ===== */
  .hero {
    background: linear-gradient(135deg, var(--blu) 0%, #0d4f7a 50%, #1a6a9a 100%);
    min-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(232,160,32,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 80% at 20% 80%, rgba(255,255,255,0.04) 0%, transparent 60%);
  }
  .hero-shapes {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .hero-shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(232,160,32,0.06);
  }
  .hero-shape:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -100px; }
  .hero-shape:nth-child(2) { width: 200px; height: 200px; bottom: 40px; left: -60px; background: rgba(255,255,255,0.04); }
  .hero-shape:nth-child(3) { width: 120px; height: 120px; top: 30%; right: 15%; background: rgba(232,160,32,0.1); }
  .hero-content { position: relative; max-width: 820px; text-align: center; }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232,160,32,0.18);
    border: 1px solid rgba(232,160,32,0.4);
    color: var(--oro-light);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  .hero h1 {
    color: #fff;
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  .hero h1 em { color: var(--oro); font-style: normal; }
  .hero p {
    color: rgba(255,255,255,0.8);
    font-size: clamp(1rem, 2vw, 1.15rem);
    line-height: 1.7;
    margin-bottom: 36px;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }
  .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--oro);
    color: var(--blu);
    font-weight: 700;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 1rem;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(232,160,32,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,160,32,0.45); background: var(--oro-light); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-weight: 600;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 1rem;
    border: 1px solid rgba(255,255,255,0.25);
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
  .hero-destinations {
    margin-top: 48px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dest-tag {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.85);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 0.8rem;
    transition: all 0.2s;
    cursor: pointer;
  }
  .dest-tag:hover { background: var(--oro); color: var(--blu); border-color: var(--oro); font-weight: 600; }

  /* ===== STATS BAR ===== */
  .stats-bar {
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 36px 24px;
  }
  .stats-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 32px;
    text-align: center;
  }
  .stat-item {}
  .stat-num {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--blu);
    line-height: 1;
    display: block;
  }
  .stat-num span { color: var(--oro); }
  .stat-label { font-size: 0.82rem; color: var(--grigio); margin-top: 6px; font-weight: 500; }
  .stat-icon { font-size: 1.6rem; margin-bottom: 8px; }

  /* ===== SEZIONE GENERICA ===== */
  section { padding: 72px 24px; }
  .section-inner { max-width: 1100px; margin: 0 auto; }
  .section-tag {
    display: inline-block;
    background: rgba(232,160,32,0.12);
    color: var(--oro);
    border: 1px solid rgba(232,160,32,0.3);
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    font-weight: 800;
    color: var(--blu);
    margin-bottom: 14px;
    line-height: 1.25;
  }
  .section-sub {
    color: var(--grigio);
    font-size: 1rem;
    line-height: 1.65;
    max-width: 580px;
    margin-bottom: 48px;
  }

  /* ===== SERVIZI GRID ===== */
  .servizi-section { background: var(--grigio-chiaro); }
  .servizi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }
  .servizio-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.06);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .servizio-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--blu), var(--oro));
    transform: scaleX(0);
    transition: transform 0.3s;
    transform-origin: left;
  }
  .servizio-card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
  .servizio-card:hover::before { transform: scaleX(1); }
  .serv-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--blu), #1a6a9a);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 18px;
  }
  .servizio-card h3 { font-size: 1.1rem; font-weight: 700; color: var(--blu); margin-bottom: 10px; }
  .servizio-card p { font-size: 0.88rem; color: var(--grigio); line-height: 1.6; margin-bottom: 14px; }
  .serv-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .serv-tag {
    background: rgba(11,61,97,0.07);
    color: var(--blu);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .serv-price {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--oro);
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== AI CHATBOT ===== */
  .ai-section { background: linear-gradient(135deg, var(--blu) 0%, #0d4f7a 100%
