name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-lint:
    name: HTML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HTMLHint
        run: npm install -g htmlhint@1.1.4

      - name: Run HTMLHint
        # blog-articles/ contiene frammenti HTML da incollare nell'editor di
        # WordPress, non documenti: iniziano con <div class="prose-blog"> e un
        # doctype non devono averlo. Vanno esclusi, altrimenti il linter li
        # boccia per "Doctype must be declared first".
        # .htmlhintignore non basta: htmlhint lo onora solo quando espande lui
        # i glob, non quando riceve i percorsi da xargs.
        #
        # .claude/ e escluso perche contiene skill di terze parti copiate
        # (vendored): i loro template HTML non sono nostri deliverable e non
        # devono rispettare le nostre regole di lint.
        #
        # In .htmlhintrc la regola tagname-lowercase e spenta: htmlhint non
        # sa niente di SVG e boccia <animateMotion>, <clipPath>,
        # <linearGradient>, <feGaussianBlur>, <textPath>, che per specifica
        # SVG DEVONO essere in camelCase. Le nostre demo usano SVG inline
        # dappertutto, quindi la regola produce solo falsi positivi.
        # Non riaccenderla: la CI diventa rossa alla prima animazione SVG.
        # (attr-lowercase invece resta accesa: quella una lista di eccezioni
        # per l'SVG ce l'ha, e accetta viewBox, repeatCount e simili.)
        run: |
          find . -name "*.html" \
            ! -path "./.claude/*" \
            ! -path "*-experiences-standard/*" \
            ! -path "*-new-template-experiences/*" \
            ! -path "./blog-articles/*" \
            ! -path "./node_modules/*" \
            -print0 | xargs -0 htmlhint --config .htmlhintrc

  link-check:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee (offline mode — internal links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude data:.*
            --exclude HERO_IMAGE_URL
            './index.html'
            './demos/**/*.html'
          fail: true
          format: markdown
          output: ./lychee-report.md

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.md
          if-no-files-found: ignore

  hub-script:
    name: Hub generator runs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run hub generator
        run: python3 scripts/generate-hub.py
